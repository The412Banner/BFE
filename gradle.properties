# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
# Build cache + configuration cache: reuse compile/dex/R8 outputs across CI runs
# (gradle/actions/setup-gradle persists the Gradle home, so these survive between runs).
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Daemon off is correct for CI (single-use JVM); harmless locally.
org.gradle.daemon=false
