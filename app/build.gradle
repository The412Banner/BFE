buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}

plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.the412banner.bfe'
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.the412banner.bfe"
        minSdkVersion 26
        targetSdkVersion 28
        // Standalone app, versioned independently of the Bannerlator lineage it was lifted from.
        versionCode 18
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    signingConfigs {
        // The BFE signing key (alias bfetest). Every release MUST be signed with this same key: it is
        // what lets a new version install over the old one and what the in-app updater relies on.
        // CI may supply it from a secret (BFE_KEYSTORE = path to the decoded keystore, passwords via
        // BFE_KEYSTORE_PASSWORD / BFE_KEY_ALIAS / BFE_KEY_PASSWORD); otherwise the committed copy is
        // used. CI checks the signed APK's certificate digest either way. Signed with v1 (JAR) + v2
        // + v3 for the broadest installer/OS compatibility.
        release {
            storeFile file(System.getenv('BFE_KEYSTORE') ?: '../keystore/bfe-test.jks')
            storePassword System.getenv('BFE_KEYSTORE_PASSWORD') ?: 'bfetest'
            keyAlias System.getenv('BFE_KEY_ALIAS') ?: 'bfetest'
            keyPassword System.getenv('BFE_KEY_PASSWORD') ?: 'bfetest'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Debug APKs are test-signed too, so a sideloaded debug build installs over a release one.
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            // The license and notice texts in the repo's licenses/ folder ship as assets so
            // Settings > Open-source licenses can show them (one copy, no duplication).
            assets.srcDir '../licenses'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    ndkVersion '29.0.14206865'

    packaging {
        resources {
            // bcprov/bcpkix are multi-release signed jars: drop the JDK9+ module bits and the
            // duplicated licence/notice files so packaging doesn't trip on them.
            excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
        jniLibs {
            // The native binaries (7zz / innoextract / unarc / ffmpeg, the ExtraFormats tools — lunzip,
            // lzop, lz4, unecm, unalz, unace, lzx — + their .so closure) are exec'd from
            // nativeLibraryDir, so they must be extracted to disk — see extractNativeLibs in the
            // manifest. Legacy packaging keeps them uncompressed and page-aligned.
            useLegacyPackaging = true
            // lib7zz.so ships a bundled libc++_shared.so next to it; pickFirst in case another
            // prebuilt ever emits its own copy so packaging never fails on a dup.
            pickFirsts += ['**/libc++_shared.so']
            // BFE has no native compilation (the .so are prebuilt + already stripped), so skip
            // AGP's strip-debug-symbols step — it's the only thing that would need the NDK, and this
            // keeps the build self-contained (no NDK download) while ndkVersion stays declared above.
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // Video-frame thumbnails in file lists (VideoFrameDecoder, registered in BfeApp).
    implementation 'io.coil-kt:coil-video:2.6.0'
    // Photo viewer: GIF / animated WebP + HEIF playback (ImageDecoderDecoder on API 28+, GifDecoder
    // below), registered on the viewer's own loader so file-list thumbnails stay still.
    implementation 'io.coil-kt:coil-gif:2.6.0'
    // Photo viewer: zoomable, sub-sampled images (telephoto, Apache-2.0). 0.8.0 is the release built
    // against Compose 1.6.1 + Coil 2.5 — exactly this BOM; later ones pull a newer Compose runtime.
    implementation 'me.saket.telephoto:zoomable-image-coil:0.8.0'
    // Photo viewer: EXIF details and lossless "Save rotation" for JPEG.
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Video / audio player: libVLC for Android (LGPL-2.1-or-later), arm64-v8a only via abiFilters.
    // Its bundled libc++_shared.so (NDK r27 beta, unstripped) loses to BFE's own r28 copy in jniLibs
    // (pickFirsts below) — libvlc.so itself is built with r28c.
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    // Aurora Glass: real blur of the content behind floating glass (pill toolbar, selection pill) via
    // RenderEffect on API 32+, a no-op below. 0.7.0 is the last release built on Compose 1.6.1 / core-ktx
    // 1.12.0, exactly what this app uses, so adding it bumps nothing (0.7.2+ pull Compose 1.6.7).
    implementation 'dev.chrisbanes.haze:haze:0.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // JVM unit tests (app/src/test): the archive-listing parser against real 7zz output fixtures, and
    // the document converters against real pandoc / LibreOffice files (resources/docs).
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.appcompat:appcompat:1.4.0'
    // Built-in HTML viewer: WebView dark-theme handling (HtmlViewerActivity).
    implementation 'androidx.webkit:webkit:1.10.0'
    // Document viewer: Markdown → HTML (commonmark-java, BSD-2-Clause) with GitHub tables, strikethrough,
    // task lists and bare-URL links (autolink-java, MIT). 0.21.0 is the last release built for Java 7 / 8
    // bytecode and APIs (0.22+ need Java 11 APIs this minSdk 26 app can't count on); ~230 KB in all.
    // Every other format (ODF, OOXML, RTF, EPUB, CSV, text) is read by BFE's own code in docs/.
    implementation 'org.commonmark:commonmark:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.21.0'
    implementation 'org.commonmark:commonmark-ext-autolink:0.21.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // topjohnwu libsu — the ONLY su-invoking dependency. Used exclusively by the Root storage
    // backend (browse/manage any app's private data on a rooted device). Lazy: root is only
    // requested on the first root action; the app works fully without it.
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:io:6.0.0'
    implementation 'com.github.topjohnwu.libsu:nio:6.0.0'

    // Archive CREATION for the two zstd formats (.tzst and the Winlator .wcp = tar.zst): the bundled
    // 7-Zip 24.08 decodes zstd but cannot encode it, so those are streamed through commons-compress
    // tar + zstd-jni (arm64 native inside the AAR). Same pair Bannerlator uses for its .wcp handling.
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    // XZ for Java (public domain): LZMA for ALZip .egg blocks and xz for Android OTA payload.bin
    // REPLACE_XZ operations, both decoded in-app (EggArchive / OtaPayload). commons-compress 1.20's
    // own LZMA/XZ support is built on this same library.
    implementation 'org.tukaani:xz:1.9'

    // APK cloner / signer (0.8). ARSCLib = pure-Java binary AndroidManifest + resources.arsc editor
    // (what APKEditor uses) for the package rename + fixups and split merging; apksig = Google's
    // pure-Java APK signer/verifier (v1/v2/v3 + 4-byte / page zip alignment); BouncyCastle bcpkix
    // only to mint the self-signed "BFE Test Key" certificate (no provider registration needed).
    implementation 'io.github.reandroid:ARSCLib:1.4.0'
    implementation 'com.android.tools.build:apksig:8.8.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // APK internals (Dex / smali): Google's smali 3.0.10 (dexlib2 reads and writes dex, baksmali turns a
    // class into smali, smali assembles it back; BSD-3-Clause). Java 8 bytecode on Guava 31.1-android, so
    // it runs on minSdk 26. The ANTLR tool and StringTemplate are build-time only for smali's grammar;
    // the assembler needs just antlr-runtime, so both are left out (~2 MB less).
    implementation('com.android.tools.smali:smali-dexlib2:3.0.10')
    implementation('com.android.tools.smali:smali-baksmali:3.0.10')
    implementation('com.android.tools.smali:smali:3.0.10') {
        exclude group: 'org.antlr', module: 'antlr'
        exclude group: 'org.antlr', module: 'stringtemplate'
        exclude group: 'antlr', module: 'antlr'
    }
    // The assembler's parser runtime (BSD-3-Clause), declared directly since the ANTLR tool it normally
    // comes through is excluded above.
    implementation 'org.antlr:antlr-runtime:3.5.2'
    // APK internals (Java class / Jar): ASM 9.9.1 (BSD-3-Clause) reads .class files; asm-util's
    // Textifier prints the javap-style listing (header, fields, methods, bytecode).
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-util:9.9.1'

    // "Access from network" (local Wi-Fi file server, works offline): NanoHTTPD serves the browser side,
    // Apache FtpServer (+ its Apache MINA networking core, pulled in transitively) the FTP side,
    // slf4j-android routes FtpServer's logging to logcat, and Nayuki's QR Code generator draws the
    // address QR. All pure Java, no native code. The web page's CSS/JS ship as Java resources
    // (src/main/resources) next to the server classes.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.apache.ftpserver:ftpserver-core:1.2.1'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation 'io.nayuki:qrcodegen:1.8.0'
}
