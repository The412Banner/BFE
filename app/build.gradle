plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.the412banner.bfe'
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.the412banner.bfe"
        minSdkVersion 26
        targetSdkVersion 28
        // Standalone app, versioned independently of the Bannerlator lineage it was lifted from.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    signingConfigs {
        // TEST key (alias bfetest). A fixed, publicly-known key so every sideload build shares one
        // signature — new builds install over-the-top instead of forcing an uninstall. Signed with
        // v1 (JAR) + v2 + v3 for the broadest installer/OS compatibility.
        release {
            storeFile file('../keystore/bfe-test.jks')
            storePassword 'bfetest'
            keyAlias 'bfetest'
            keyPassword 'bfetest'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Debug APKs are test-signed too, so a sideloaded debug build installs over a release one.
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    ndkVersion '29.0.14206865'

    packaging {
        jniLibs {
            // The native binaries (7zz / innoextract / unarc + their .so closure) are exec'd from
            // nativeLibraryDir, so they must be extracted to disk — see extractNativeLibs in the
            // manifest. Legacy packaging keeps them uncompressed and page-aligned.
            useLegacyPackaging = true
            // lib7zz.so ships a bundled libc++_shared.so next to it; pickFirst in case another
            // prebuilt ever emits its own copy so packaging never fails on a dup.
            pickFirsts += ['**/libc++_shared.so']
            // BFE has no native compilation (the .so are prebuilt + already stripped), so skip
            // AGP's strip-debug-symbols step — it's the only thing that would need the NDK, and this
            // keeps the build self-contained (no NDK download) while ndkVersion stays declared above.
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
