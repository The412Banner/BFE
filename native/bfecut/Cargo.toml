[package]
name = "bfecut"
version = "0.1.0"
edition = "2021"
description = "BFE's space-saving unpacker: unpacks an archive from the end and shrinks it as files land"
license = "GPL-3.0-or-later"
publish = false

# Rust standard library only.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
