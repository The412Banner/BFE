name: Build BFE (signed release APK)

# Single-variant build for the sideload-only BFE app. Sets up JDK 17 + the Android SDK, assembles
# the (test-signed) release APK, and uploads it as an artifact. No flavors, no NDK build, no imagefs.
# Caching is tuned for fast warm-starts (Gradle deps + build cache + configuration cache + SDK).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        # Belt-and-suspenders: setup-gradle below owns the primary Gradle cache.
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The action's default list includes the long-retired 'tools' package, which current
        # sdkmanager no longer knows ("Failed to find package 'tools'"); AGP fetches the rest.
        packages: 'platform-tools'

    # Cache the resolved SDK packages (platforms / build-tools) AGP auto-downloads, keyed on the
    # toolchain inputs so it only re-provisions when compileSdk/build-tools/AGP actually change.
    - name: Cache Android SDK packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.ANDROID_SDK_ROOT }}/platforms
          ${{ env.ANDROID_SDK_ROOT }}/build-tools
          ~/.android/build-cache
        key: android-sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml') }}
        restore-keys: |
          android-sdk-${{ runner.os }}-

    - name: Set up Gradle (dependency + build + configuration cache)
      uses: gradle/actions/setup-gradle@v4
      # setup-gradle keys its cache on the gradle files + wrapper automatically and restores from
      # main's cache for branch/PR builds; it reports cache hit/miss in the job summary.

    # The signing key comes from the BFE_KEYSTORE_B64 secret when it is set (base64 of the keystore),
    # otherwise from the committed keystore/bfe-test.jks. Both are the SAME key; the check below fails
    # the build if the APK is ever signed with anything else, because a different key would break
    # installing over existing versions and the in-app updater.
    - name: Prepare signing key
      env:
        KEYSTORE_B64: ${{ secrets.BFE_KEYSTORE_B64 }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bfe.jks"
          echo "BFE_KEYSTORE=$RUNNER_TEMP/bfe.jks" >> "$GITHUB_ENV"
          echo "signing with the key from the BFE_KEYSTORE_B64 secret"
        else
          echo "signing with the committed keystore/bfe-test.jks"
        fi

    - name: Assemble signed release APK
      env:
        BFE_KEYSTORE_PASSWORD: ${{ secrets.BFE_KEYSTORE_PASSWORD }}
        BFE_KEY_ALIAS: ${{ secrets.BFE_KEY_ALIAS }}
        BFE_KEY_PASSWORD: ${{ secrets.BFE_KEY_PASSWORD }}
      run: ./gradlew --no-daemon --build-cache assembleRelease

    - name: Check the signing certificate
      run: scripts/check-signing.sh app/build/outputs/apk/release/*.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: bfe-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
