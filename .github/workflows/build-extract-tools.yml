name: Build extract tools (arm64 Android)

# Cross-compiles the single-format extractors BFE execs from nativeLibraryDir for
# aarch64-linux-android26 with the Android NDK, and uploads them (already renamed lib<name>.so)
# as the `extract-tools-arm64` artifact:
#   liblunzip.so  lunzip 1.15            lzip (.lz / .tlz)              GPL-2.0-or-later
#   liblzop.so    lzop 1.04 + LZO 2.10   lzop (.lzo / .tzo)             GPL-2.0-or-later
#   liblz4.so     lz4 1.10.0 CLI         LZ4 frame + legacy (.lz4)      GPL-2.0-or-later (lib: BSD-2)
#   libunecm.so   ecm-tools 1.0.3        ECM CD images (.ecm)           GPL-3.0-or-later
#   libunalz.so   unalz 0.65 + libiconv  ALZip .alz                     zlib (+ bzip2 / LGPL iconv)
#   libunace.so   unace 1.2b (Debian)    ACE 1.x (.ace)                 GPL-2.0-or-later
#   liblzx.so     amiga-lzx 0.1.5 `lzx`  Amiga LZX (.lzx)               WTFPL
# The C/C++ tools are linked fully static (no NEEDED libraries); lzx (Rust) is a PIE linked only
# against bionic system libraries. Every source is pinned by version + SHA-256, and the Debian /
# BFE patches applied on top live in native/patches/. The binaries are committed to
# app/src/main/jniLibs/arm64-v8a/ by hand after an on-device check (see licenses/NOTICE_*.txt).
# Runs on demand, or by itself when this file or the patches change; its own concurrency group so it
# never cancels build.yml.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-extract-tools.yml'
      - 'native/**'

permissions:
  contents: read

concurrency:
  group: extract-tools-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_PKG: "ndk;29.0.14206865"
  NDK_FALLBACK_URL: https://dl.google.com/android/repository/android-ndk-r29-linux.zip
  API: 26

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 17 (needed by sdkmanager)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The action's default list includes the retired 'tools' package (see build.yml).
        packages: 'platform-tools'

    - name: Install host tools
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends make patch xz-utils file curl unzip autotools-dev

    - name: Provision NDK (sdkmanager, fallback to r29 zip)
      run: |
        set -euo pipefail
        NDK=""
        if yes | sdkmanager --install "$NDK_PKG" >/tmp/sdkmanager.log 2>&1; then
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_PKG#ndk;}"
          echo "sdkmanager installed $NDK_PKG"
        else
          echo "sdkmanager failed for $NDK_PKG:"; tail -20 /tmp/sdkmanager.log || true
        fi
        if [ -z "$NDK" ] || [ ! -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64" ]; then
          echo "Downloading fallback NDK from $NDK_FALLBACK_URL"
          curl -sSL -o /tmp/ndk.zip "$NDK_FALLBACK_URL"
          unzip -q /tmp/ndk.zip -d "$HOME"
          NDK="$(ls -d "$HOME"/android-ndk-r29* | head -1)"
        fi
        test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64" || { echo "No usable NDK found"; exit 1; }
        cat "$NDK/source.properties"
        TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
        BIN="$TOOLCHAIN/bin"
        {
          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "SYSROOT=$TOOLCHAIN/sysroot"
          echo "PREFIX=$GITHUB_WORKSPACE/build/prefix"
          echo "DIST=$GITHUB_WORKSPACE/build/dist"
          echo "SRC=$GITHUB_WORKSPACE/build/src"
          echo "CC=$BIN/aarch64-linux-android${API}-clang"
          echo "CXX=$BIN/aarch64-linux-android${API}-clang++"
          echo "AR=$BIN/llvm-ar"
          echo "RANLIB=$BIN/llvm-ranlib"
          echo "STRIP=$BIN/llvm-strip"
          echo "READELF=$BIN/llvm-readelf"
        } >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/build/prefix" "$GITHUB_WORKSPACE/build/dist" "$GITHUB_WORKSPACE/build/src"
        # unalz links zlib statically from the NDK sysroot; fail early and loudly if it's not there.
        ls -la "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/" | grep -E 'lib(z|c|m)\.a' || true
        test -f "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libz.a"

    - name: Fetch sources (pinned SHA-256)
      working-directory: build/src
      run: |
        set -euo pipefail
        # fetch <out> <sha256> <url> [fallback url...]
        fetch() {
          local out=$1 sha=$2; shift 2
          for u in "$@"; do
            if curl -fsSL --retry 4 --retry-delay 5 -o "$out" "$u" && echo "$sha  $out" | sha256sum -c --quiet -; then
              echo "ok  $out  <- $u"; return 0
            fi
            echo "::warning::download failed or SHA-256 mismatch: $u"
          done
          echo "::error::could not fetch $out"; return 1
        }
        fetch lunzip-1.15.tar.gz fdb930b87672a238a54c4b86d63df1c86038ff577d512adbc8e2c754c046d8f2 \
          https://download.savannah.gnu.org/releases/lzip/lunzip/lunzip-1.15.tar.gz \
          https://download-mirror.savannah.gnu.org/releases/lzip/lunzip/lunzip-1.15.tar.gz
        fetch lzo-2.10.tar.gz c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072 \
          https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
        fetch lzop-1.04.tar.gz 7e72b62a8a60aff5200a047eea0773a8fb205caf7acbe1774d95147f305a2f41 \
          https://www.lzop.org/download/lzop-1.04.tar.gz
        fetch lz4-1.10.0.tar.gz 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b \
          https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz
        fetch ecm-tools-1.0.3.tar.gz 7b7475789603e64c7ae3ddcb0e95f09640ba37a7f13b29c8e8f2f4087bd872c9 \
          https://github.com/alucryd/ecm-tools/archive/refs/tags/v1.0.3.tar.gz
        fetch libiconv-1.17.tar.gz 8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313 \
          https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz \
          https://ftpmirror.gnu.org/libiconv/libiconv-1.17.tar.gz
        fetch unalz_0.65.orig.tar.gz 4c26699eb7545072de2ef7de79b4fff1f01c4db09cebff2d8d50ec03d5d74db0 \
          https://deb.debian.org/debian/pool/main/u/unalz/unalz_0.65.orig.tar.gz \
          https://snapshot.debian.org/archive/debian/20250101T000000Z/pool/main/u/unalz/unalz_0.65.orig.tar.gz
        fetch unace_1.2b.orig.tar.gz a5f3b7d0994b2c6aa3b95ac1196ee18605d8dbd0660f978f8d64b8583fb55490 \
          https://deb.debian.org/debian/pool/main/u/unace/unace_1.2b.orig.tar.gz \
          https://snapshot.debian.org/archive/debian/20250101T000000Z/pool/main/u/unace/unace_1.2b.orig.tar.gz
        fetch amiga-lzx-0.1.5.tar.gz 1097a6334e555dbf74aed1777afa1ce3613a5a4572b608aa303a071b3c6f0664 \
          https://github.com/bitplane/amiga-lzx/archive/refs/tags/v0.1.5.tar.gz
        for t in *.tar.gz; do tar xzf "$t"; done
        ls -la

    - name: Build lunzip (lzip)
      working-directory: build/src/lunzip-1.15
      run: |
        set -euo pipefail
        ./configure CC="$CC" CFLAGS="-O2 -Wall" LDFLAGS="-static"
        make -j"$(nproc)"
        install -m 755 lunzip "$DIST/liblunzip.so"

    - name: Build LZO 2.10 + lzop 1.04
      working-directory: build/src
      run: |
        set -euo pipefail
        # Refresh the 2017 config.sub/config.guess so the android host triple is known.
        for d in lzo-2.10 lzop-1.04; do
          find "$d" \( -name config.sub -o -name config.guess \) -exec sh -c 'cp "/usr/share/misc/$(basename "$1")" "$1"' _ {} \;
        done
        (cd lzo-2.10 && ./configure --host=aarch64-linux-android --prefix="$PREFIX" --disable-shared --enable-static \
           CC="$CC" CFLAGS="-O2" && make -j"$(nproc)" && make install)
        # lzop's help.c defines a global sysinfo(), which collides with bionic's static libc.a when
        # linked -static; rename lzop's own function at compile time.
        (cd lzop-1.04 && ./configure --host=aarch64-linux-android CC="$CC" CFLAGS="-O2" \
           CPPFLAGS="-I$PREFIX/include -Dsysinfo=lzop_sysinfo" LDFLAGS="-L$PREFIX/lib -static" && make -j"$(nproc)")
        install -m 755 lzop-1.04/src/lzop "$DIST/liblzop.so"

    - name: Build lz4 1.10.0 CLI
      working-directory: build/src/lz4-1.10.0
      run: |
        set -euo pipefail
        make -C programs lz4 -j"$(nproc)" CC="$CC" CFLAGS="-O2" LDFLAGS="-static"
        install -m 755 programs/lz4 "$DIST/liblz4.so"

    - name: Build unecm (ecm-tools 1.0.3, decode-only)
      working-directory: build/src/ecm-tools-1.0.3
      run: |
        set -euo pipefail
        patch -p1 < "$GITHUB_WORKSPACE/native/patches/ecm-tools/0001-decode-only.patch"
        "$CC" -O2 -Wall -static -o unecm ecm.c
        install -m 755 unecm "$DIST/libunecm.so"

    - name: Build GNU libiconv 1.17 (static, for unalz's CP949 -> UTF-8 names)
      working-directory: build/src/libiconv-1.17
      run: |
        set -euo pipefail
        ./configure --host=aarch64-linux-android --prefix="$PREFIX" --disable-shared --enable-static --disable-nls \
          CC="$CC" CFLAGS="-O2"
        make -j"$(nproc)"
        make install
        ls -la "$PREFIX/lib" "$PREFIX/include"

    - name: Build unalz 0.65 (Debian patch set)
      working-directory: build/src/unalz
      run: |
        set -euo pipefail
        while read -r p; do [ -n "$p" ] && patch -p1 < "$GITHUB_WORKSPACE/native/patches/unalz/$p"; done \
          < "$GITHUB_WORKSPACE/native/patches/unalz/series"
        # main.cpp includes <sys/timeb.h> but uses nothing from it; bionic doesn't ship the header.
        mkdir -p shim/sys obj
        [ -f "$SYSROOT/usr/include/sys/timeb.h" ] || echo '/* BFE: unused by unalz; absent from bionic. */' > shim/sys/timeb.h
        FLAGS="-O2 -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64 -D_UNALZ_ICONV -D_UNALZ_UTF8 -I$PREFIX/include -Ishim -I."
        for f in UnAlzBz2decompress.c UnAlzbzlib.c bzip2/blocksort.c bzip2/compress.c bzip2/crctable.c bzip2/huffman.c bzip2/randtable.c; do
          "$CC" $FLAGS -std=gnu99 -c "$f" -o "obj/$(basename "${f%.c}").o"
        done
        for f in main.cpp UnAlz.cpp UnAlzUtils.cpp UnAlzBzip2.cpp; do
          "$CXX" $FLAGS -c "$f" -o "obj/${f%.cpp}.o"
        done
        "$CXX" -static -o unalz obj/*.o "$PREFIX/lib/libiconv.a" -lz
        install -m 755 unalz "$DIST/libunalz.so"

    - name: Build unace 1.2b (Debian patch set)
      working-directory: build/src/unace1.2b
      run: |
        set -euo pipefail
        while read -r p; do [ -n "$p" ] && patch -p1 < "$GITHUB_WORKSPACE/native/patches/unace/$p"; done \
          < "$GITHUB_WORKSPACE/native/patches/unace/series"
        "$CC" -O2 -Wall -DUNIX -DCASEINSENSE -DLO_HI_BYTE_ORDER -static -o unace \
          globals.c uac_comm.c uac_crc.c uac_crt.c uac_dcpr.c uac_sys.c unace.c
        install -m 755 unace "$DIST/libunace.so"

    - name: Build lzx (amiga-lzx 0.1.5, Rust)
      working-directory: build/src/amiga-lzx-0.1.5
      run: |
        set -euo pipefail
        rustup target add aarch64-linux-android
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
        export CC_aarch64_linux_android="$CC" AR_aarch64_linux_android="$AR"
        cargo --version
        cargo build --release --locked --target aarch64-linux-android -p amiga-lzx-cli
        install -m 755 target/aarch64-linux-android/release/lzx "$DIST/liblzx.so"

    - name: Strip + inspect
      working-directory: build/dist
      run: |
        set -euo pipefail
        for f in lib*.so; do
          "$STRIP" "$f"
          echo "==== $f"
          file "$f"
          "$READELF" -d "$f" | grep NEEDED || echo "no NEEDED (static)"
          if "$READELF" -l "$f" | grep -q INTERP; then echo "DYNAMIC (PIE, bionic)"; else echo "STATIC"; fi
        done
        {
          echo "BFE extract tools — built $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA}"
          echo "NDK: $(grep Pkg.Revision "$NDK/source.properties"), target aarch64-linux-android${API}"
          echo "rustc: $(rustc --version)"
          echo
          echo "Sources (SHA-256):"
          (cd "$SRC" && sha256sum *.tar.gz)
          echo
          echo "Binaries (SHA-256, stripped):"
          sha256sum lib*.so
          echo
          ls -la lib*.so
        } > BUILD_INFO.txt
        cat BUILD_INFO.txt

    - name: Upload extract-tools-arm64
      uses: actions/upload-artifact@v4
      with:
        name: extract-tools-arm64
        path: |
          build/dist/lib*.so
          build/dist/BUILD_INFO.txt
        if-no-files-found: error
